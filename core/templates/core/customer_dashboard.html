{% extends 'core/base.html' %}
{% block title %}Customer Dashboard — Eventora{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="fw-bold">Customer Dashboard</h2>
    <p class="text-muted">Welcome, {{ user.username }}!</p>

    <div class="eventora-card p-4 mt-4" style="max-width: 400px;">
        <h5 class="fw-bold">Your Bookings</h5>
        <a href="{% url 'core:my_bookings' %}" class="btn btn-eventora-primary mt-3">View My Bookings</a>
        <a href="{% url 'core:browse_services' %}" class="btn btn-outline-secondary mt-3 ms-2">Browse Services</a>
    </div>
</div>
{% endblock %}
