<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background-color: #e0f2fe;
            color: #0284c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }

        .card h2 {
            font-size: 22px;
            color: #111827;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-login {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-circle">&#10003;</div>
        <h2>Password is Reset</h2>
        <p>Your password has been successfully reset. You can now use your new password to sign in.</p>

        <!-- Update with your URL name, e.g. {% url 'core:login' %} if inside a named app -->
        <a href="{% url 'core:login' %}" class="btn-login"> Go to Login</a>
    </div>

</body>
</html>
